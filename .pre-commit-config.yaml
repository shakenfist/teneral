# The checks a commit has to pass here. `pre-commit run --all-files` is
# what a developer runs before proposing a commit, and ci.yml runs the
# same command on every pull request, so the two cannot drift apart.
#
# The Rust hooks run in a Docker image rather than on the host, because
# Rust toolchains are deliberately not installed on the development
# machine, and they go through the Makefile so that there is one
# description of how a container is started. Each is gated on the files
# it has an opinion about: starting a container costs seconds, and a
# hook that does it on every unrelated commit is a hook people learn to
# skip. See docs/development.md.

repos:
  # rustfmt and clippy over the workspace, and the deterministic half
  # of cargo-deny. Both call the Makefile; the script says why
  # advisories are not here.
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh lint
        language: script
        pass_filenames: false
        files: \.rs$

      # Gated on the manifests and the lockfile rather than on source,
      # because those are what change the dependency tree this check
      # has an opinion about. deny.toml is in the set too, so a change
      # to the policy is checked by the policy.
      - id: cargo-deny
        name: cargo-deny licences, bans and sources
        entry: ./scripts/check-rust.sh deny
        language: script
        pass_filenames: false
        files: ^(.*/)?(Cargo\.toml|Cargo\.lock|deny\.toml)$

  # GitHub Actions workflow linter. The config declares the self-hosted
  # runner labels these workflows use, so a label that does not exist
  # on the fleet fails here rather than leaving a job queued for a
  # runner that never comes.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ['-config-file', '.github/actionlint.yaml']

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # A unified diff's unchanged context lines begin with a single
      # space, so a blank context line is one space and nothing else.
      # Stripping it silently corrupts every patch staged under
      # upstream/, which is why they are excluded rather than fixed.
      #
      # The review marks and their sidecars are excluded from both
      # rewriting hooks because their generator emits no trailing
      # newline, so end-of-file-fixer rewrites them on every
      # --all-files run and reports a failure nobody can usefully fix:
      # committing the newline only means the next regeneration drops
      # it again. The exclude is on these two hooks rather than at the
      # top level on purpose -- review notes are human-written prose,
      # and a blanket exclude would stop gitleaks and skillsaw reading
      # exactly the kind of text a credential or a smuggled character
      # lands in.
      - id: trailing-whitespace
        exclude: '(\.patch$|^\.vscode/.*\.weaudit)'
      - id: end-of-file-fixer
        exclude: '^\.vscode/.*\.weaudit'
      - id: check-yaml
      - id: check-merge-conflict

  # Shell scripts, wherever they land. -x so a script that sources a
  # sibling is followed rather than guessed at.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  # The pre-commit half of the secret scanning the secret-handling
  # audit asks for. secret-scan.yml is the CI half, and it scans the
  # history rather than the working tree.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lints the agent context -- AGENTS.md and anything else an agent is
  # handed -- for malformed structure, smuggled instructions, unicode
  # tricks and pasted credentials. A weekly fleet audit reports the
  # same thing; this is what catches it in the commit that writes it.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.23.0
    hooks:
      - id: skillsaw
