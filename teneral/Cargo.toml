[package]
name = "teneral"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A DHCP and DNS daemon for many networks in one process"

# Not a crates.io artifact. This is a binary, built from the libraries
# beside it and installed by whatever packages the daemon, so there is
# nothing for a registry to serve. It also means its path dependencies
# on those libraries need no version requirement beside them, which
# keeps this project's release number in the single place the release
# tooling knows how to move.
publish = false

# Inherit the workspace lint table rather than restating it. Without
# this the workspace `[workspace.lints]` block applies to nothing at
# all, which fails quietly: the lints look configured and are not.
[lints]
workspace = true

[dependencies]
# The control plane: the listener the daemon serves and the client
# the subcommands speak through. Its path and the reason it carries no
# version requirement are in the workspace manifest.
teneral-api = { workspace = true }

# The DHCPv4 front-end: its wire, the question it asks the store and
# the sockets it answers on. The daemon opens one socket per interface
# an operator named and hands each datagram to this crate; every
# judgement about what a client is told is made inside it.
teneral-dhcp = { workspace = true }

# The store the daemon opens. The daemon names it directly, rather
# than reaching it through the control plane, because opening it with
# the operator's retention is the one thing that happens before any
# listener exists.
teneral-store = { workspace = true }

# The command line, for the daemon's flags and the client's
# subcommands.
#
# `derive` is the point: a flag is a field with a default and a doc
# comment, and `--help` is generated from them, which is what makes
# "every flag is listed with its default" a property of the code
# rather than of somebody remembering to update a help string. There
# is no configuration file and will not be one, so this is the whole
# of how the daemon is configured and its help text is the reference.
#
# Defaults are off and the rest is chosen: `std` is required, `help`
# and `usage` are what `--help` and a usage error print, and
# `error-context` is what lets a rejected value say which flag it was
# given to. Deliberately absent are `color` and `suggestions`, which
# pull in terminal-colour crates and a string-distance crate to make
# an error message friendlier on a daemon whose output is read in a
# journal, and `env`, because a credential is the one value this
# program reads from the environment and it does so by hand, in one
# place, so that a flag cannot quietly start taking one.
clap = { version = "4.6.10", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# The runtime, which the binary owns: the libraries below it pick no
# flavour, so the choice is made here.
#
#   `rt-multi-thread`  connections are tasks and the daemon serves
#                      many of them; the store does its blocking on
#                      threads of its own, so this is not a pool
#                      anything blocks.
#   `signal`           SIGINT and SIGTERM, which are how a daemon is
#                      asked to stop, by an operator and by systemd
#                      respectively.
#   `macros`           `select!`, to wait for whichever arrives first.
#   `time`             the bound on how long shutdown lets open
#                      streams finish before giving up on them.
#   `sync`             the channel that tells each DHCP socket's task
#                      to stop, so that the sockets are closed before
#                      the store is rather than being cancelled with
#                      the runtime.
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "signal", "macros", "time", "sync"] }

# Only the differential rig reads these. `toml` is the format cargo
# itself reads, which is the reason a case's metadata is written in
# it: the alternative was a bespoke key-value file and a hand-written
# parser to go with it, in a repository that already cannot build
# without a TOML parser.
[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.2.2"

# The differential rig. `harness = false` replaces libtest with the
# rig's own `main`, which is what makes `make test` print the corpus
# case by case rather than one opaque `ok`: libtest captures a test's
# output and shows it only when the test fails, and a rig whose
# passing runs say nothing is a rig that can quietly stop checking
# anything. Two consequences, both recorded in
# tests/differential/README.md: `cargo test <filter>` does not filter
# inside this target, and nothing in it is a `#[test]`, so
# `allow-unwrap-in-tests` does not reach it and the rig obeys
# `unwrap_used` like ordinary code.
[[test]]
name = "differential"
path = "tests/differential/main.rs"
harness = false
