# One captured DHCPv4 exchange. See ../../README.md for what a case
# is, and ../../../../../docs/differential-rig.md for how a capture
# gets into this corpus lawfully.

summary = "A DISCOVER declaring no hardware address at all, which nothing answered."

# The docs/provenance.md rows these bytes are the evidence for, by
# row id. The harness fails this case if the list is empty or if a
# row id is not in that file.
provenance = [
    "dhcp-hlen-zero-unanswered",
]

request = "request.hex"

[capture]
observed = "2026-11-27"
server = "dnsmasq 2.91-1+deb13u2, Debian 13.8, kernel 6.12.118+deb13-amd64, serving --dhcp-range=tag:gw-n1,10.0.0.100,10.0.0.150,12h and --dhcp-range=tag:gw-n2,10.0.0.200,10.0.0.250,12h on gw-n1 and gw-n2 with --bind-dynamic"
client = "a request built octet by octet and sent on the bridge from a client endpoint by the probe script of experiment 6; the reply is the measurement and is dnsmasq 2.91-1+deb13u2's own"
link_type = "EN10MB"
# The capture file is kept outside this repository: a pcap is not an
# artifact a reviewer can read, and the frames that matter are here as
# hex text instead. The digest ties the two back together.
pcap = "lbrlab-1795723089-dnsmasq-br-n1.pcap"
pcap_sha256 = "fabde438aef41f22d4892fcf5e3a8cfa99a0d017506641708a2acef9b1c29e38"
frames = "20 of 28, and no reply among the other 27"
write_up = "linux-bridge-lab.md, experiment 6"
request_bytes = 342

[network]
# The configuration the capture was taken against, as data: a DHCP
# reply is not a function of the request alone.
name = "n1"
interface = "gw-n1"
server_address = "10.0.0.1"
prefix_length = 24
lease_seconds = 43200

[[network.ranges]]
name = "pool"
first = "10.0.0.100"
last = "10.0.0.150"

[comparison]
subject = "dhcpv4"
status = "compared"
expect = "silence"
fields = []
agree = []
diverges = []
asserts = """
`hlen` of zero, with six octets of hardware address sitting in `chaddr`
regardless. dnsmasq did not answer it, and said in its log that the
request presented no unique identifier. teneral refuses the datagram
before anything reads `chaddr`, so nothing goes out.

The two agree on the wire and not in their reasons, and the case says
so because the reasons are what a reader needs. teneral's guard is
there because the decoder it uses sizes a slice of the sixteen-octet
`chaddr` field by this unvalidated byte; above sixteen that reads
neighbouring packet, and a guard that refused only the dangerous values
would be a guard whose boundary had to be right. Zero is refused
because truncating a hardware address to nothing leaves no address to
answer to.

The capture holds no reply, and that absence is the measurement: every
frame crossing the bridge on port 67 or 68 for the seconds either side
is in the pcap this case names.
"""
