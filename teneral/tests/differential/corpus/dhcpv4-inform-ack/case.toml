# One captured DHCPv4 exchange. See ../../README.md for what a case
# is, and ../../../../../docs/differential-rig.md for how a capture
# gets into this corpus lawfully.

summary = "A request for configuration alone, and the ACK that carries no lease."

# The docs/provenance.md rows these bytes are the evidence for, by
# row id. The harness fails this case if the list is empty or if a
# row id is not in that file.
provenance = [
    "dhcp-inform-answered-without-a-lease",
    "dhcp-reply-padded-to-bootp-minimum",
    "dhcp-reply-names-itself-as-next-server",
]

request = "request.hex"
response = "response.hex"

[capture]
observed = "2026-11-27"
server = "dnsmasq 2.91-1+deb13u2, Debian 13.8, kernel 6.12.118+deb13-amd64, serving --dhcp-range=tag:gw-n1,10.0.0.100,10.0.0.150,12h and --dhcp-range=tag:gw-n2,10.0.0.200,10.0.0.250,12h on gw-n1 and gw-n2 with --bind-dynamic"
client = "a request built octet by octet and sent on the bridge from a client endpoint by the probe script of experiment 6; the reply is the measurement and is dnsmasq 2.91-1+deb13u2's own"
link_type = "EN10MB"
# The capture file is kept outside this repository: a pcap is not an
# artifact a reviewer can read, and the frames that matter are here as
# hex text instead. The digest ties the two back together.
pcap = "lbrlab-1795723089-dnsmasq-br-n1.pcap"
pcap_sha256 = "fabde438aef41f22d4892fcf5e3a8cfa99a0d017506641708a2acef9b1c29e38"
frames = "11 and 12 of 28"
write_up = "linux-bridge-lab.md, experiment 6"
request_bytes = 342
response_bytes = 342

[network]
# The configuration the capture was taken against, as data: a DHCP
# reply is not a function of the request alone.
name = "n1"
interface = "gw-n1"
server_address = "10.0.0.1"
prefix_length = 24
lease_seconds = 43200

[[network.ranges]]
name = "pool"
first = "10.0.0.100"
last = "10.0.0.150"

[comparison]
subject = "dhcpv4"
status = "compared"
fields = [
    "op",
    "htype",
    "hlen",
    "hops",
    "xid",
    "secs",
    "flags",
    "giaddr",
    "chaddr",
    "sname",
    "file",
    "yiaddr",
    "option-codes",
    "option-53",
    "option-54",
    "option-1",
    "option-28",
    "option-3",
    "option-6",
    "ip-source",
    "ip-destination",
    "payload-length",
]
agree = []
diverges = [
    "siaddr",
    "ciaddr",
]
asserts = """
An INFORM asks for configuration and not for an address. The client
already has one, names it in `ciaddr`, and the answer must carry the
options without a lease.

This is the case where the two implementations agree most closely. Both
send exactly six options -- 53, 54, 1, 28, 3 and 6 -- in that order,
with no lease time, no T1 and no T2, and a zero `yiaddr`; both address
the reply to the `ciaddr` the client sent. So `option-codes` is
compared here where the OFFER and ACK cases have to declare it
divergent, and the absence of the three time options is asserted by
comparing the code sequence rather than by naming each missing one.

No lease is written for an INFORM, which is a property of the store
rather than of the bytes and is asserted by the decision layer's own
tests; what this case establishes is that the reply says so.

Both replies are 300 octets, which for an answer carrying six options
means twenty-six octets of zero padding after the end option in each:
RFC 1542 section 2.1 has a receiver discard a shorter message silently,
so the length is compared here rather than declared divergent.

`ciaddr` diverges because dnsmasq echoes it and teneral sends zero, and
`siaddr` for the usual reason.
"""
