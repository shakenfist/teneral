[workspace]
# Three members. `teneral` is the daemon; `teneral-store` is the
# binding store and `teneral-api` is the control plane over it. Each
# of the two libraries is a crate rather than a module inside the
# daemon for two reasons that are not tidiness.
#
# The first is that this repository is teneral's core libraries, so
# the store's public surface is an interface another repository links
# rather than an internal arrangement this one is free to reshape.
# `teneral-api` is that same argument one layer up, and it has a
# consumer in view already: the product whose interface is a browser
# is a separate binary in a separate repository, and what it links is
# this crate's client. Were the control plane written inside the
# daemon, that consumer would hold a second model of the resources and
# the scopes -- which is a second implementation of the rules that
# keep one network's answers out of another's, in the component least
# likely to be tested with two networks.
#
# The second is enforcement. The store's rule is that the network is a
# parameter of every operation, not a column an implementation is
# trusted to filter on, and that rule is only mechanical if a caller
# cannot reach the SQL. Inside one crate it is a convention somebody
# polices in review; across a crate boundary with the connection type
# private, a front-end that wants to skip the network has to add a
# public method to do it, which is a diff a reviewer sees. The API
# crate sits on the far side of that boundary like any other consumer:
# it reaches the store only through the trait, so a handler cannot
# answer from anything the store would not have scoped.
members = ["teneral", "teneral-api", "teneral-store"]

# The MSRV-aware resolver: it prefers the newest dependency version
# whose own `rust-version` the floor declared below can still build,
# and errors naming the crate when no version qualifies. Stated
# explicitly because a virtual workspace manifest does not inherit a
# member's edition default. This is what keeps that floor honest --
# under the older resolver cargo picks the newest version regardless,
# the build still succeeds on the container's much newer toolchain,
# and the declared floor quietly becomes a fiction. Here, a
# dependency that needs more makes that visible at resolution time,
# and the floor is then raised deliberately.
resolver = "3"

# How this workspace's own crates depend on each other, written once
# here rather than in each member that links one.
#
# A path and no version, which is a statement about publishing rather
# than a shortcut. A path dependency carrying no version requirement
# reads as a requirement on any version at all, and the supply-chain
# gate denies a wildcard -- but it allows one on a path belonging to a
# crate that is not published, such a dependency never being resolved
# from a registry. The members that link this are therefore
# `publish = false`, each saying why.
#
# The alternative was a version requirement here, and it was declined:
# it would put this project's release number in a second place that
# `tools/release-version.sh` does not set, that tool reading and
# writing `[workspace.package]` and nothing else.
[workspace.dependencies]
teneral-api = { path = "teneral-api" }
teneral-store = { path = "teneral-store" }

[workspace.lints.clippy]
# A panic is a cluster-wide outage here: one process serves every
# network, so an `unwrap()` on anything derived from a packet is a
# remote denial of service against all of them at once.
#
# `deny` rather than `warn`, which changes where the lint bites and
# not whether. `make lint` passes `-D warnings`, so either setting
# blocks the gate. The difference is everything before the gate: a
# bare `cargo clippy`, and an editor running clippy as you type,
# report `deny` as an error and `warn` as one more line of yellow
# among many. Note that this is a clippy lint, so an ordinary
# `cargo build` never evaluates it at all -- only clippy does.
#
# Test code is exempt through `allow-unwrap-in-tests` in the root
# `clippy.toml`.
unwrap_used = "deny"

[workspace.package]
version = "0.1.0"
# Edition 2024. This is a new tree with nothing to migrate, so there
# is no reason to start on an older edition, and the newer defaults
# are ones this project wants: `unsafe_op_in_unsafe_fn` warns rather
# than being silently allowed, and the tightened temporary-lifetime
# and RPIT capture rules remove two classes of surprise from code
# that will hold locks across awaits.
edition = "2024"
# Raised from the 1.85 that edition 2024 imposes, because `rusqlite`
# needs more: every release of it from 0.41.0 onwards declares an MSRV
# of 1.89.0, and the store takes the current one. The value is written
# here and nowhere else -- both crates inherit it with
# `rust-version.workspace = true`.
# Deliberately not the build image's compiler version: the image tag
# says which toolchain builds the project, this says which toolchains
# the source is willing to be built by, and the two answer different
# questions.
#
# Worth knowing how this one presented itself, because it was the
# quiet variant rather than the loud one. The MSRV-aware resolver
# above fails and names the crate only when *no* version of it
# qualifies. `rusqlite` 0.40.2 and earlier declare no `rust-version`
# at all, so at a 1.85 floor the resolver skipped 0.41.0 through
# 0.43.0, selected a release three months old, and succeeded. The
# floor had become a fiction and nothing said so; the lockfile was
# the only place it showed.
#
# What raises it: a language or library feature stabilised later than
# this that the code actually uses, or a dependency whose own
# `rust-version` is higher. Raise it in the same commit as the thing
# that needed it, and check the lockfile afterwards rather than only
# the exit status -- raising the floor also unblocks newer versions of
# everything else resolution had been holding back.
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Michael Still <mikal@stillhq.com>"]
repository = "https://github.com/shakenfist/teneral"
